<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duels - 서버 점검 중</title>
  <style>
    :root{
      --font-ui:"SUIT Variable","SUIT","Pretendard Variable","Pretendard","Wanted Sans","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",Arial,sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}

    body{
      overflow:hidden;
      background:#0a0a0c;
      color:#e0e0e0;
      font-family:var(--font-ui);
      font-weight:400;
      letter-spacing:-.018em;
      user-select:none;
    }

    .screen{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      background:#0a0a0c;
    }

    .title{
      color:#4af;
      font-size:clamp(34px,5vw,54px);
      font-weight:650;
      letter-spacing:.07em;
      line-height:1.08;
      text-transform:uppercase;
      text-shadow:0 0 18px rgba(68,170,255,.16);
    }

    .sub{
      margin-top:5px;
      margin-bottom:34px;
      color:#556;
      font-size:12px;
      letter-spacing:2px;
    }

    .maintenance{
      position:relative;
      width:min(440px,calc(100vw - 40px));
      padding:30px 28px 27px;
      border:1px solid #2a4a6a;
      border-radius:2px;
      background:#0a0a0c;
      box-shadow:0 0 0 1px #101b26,0 0 34px rgba(68,170,255,.10);
      text-align:center;
    }

    .maintenance::before,
    .maintenance::after{
      content:"";
      position:absolute;
      width:18px;
      height:18px;
      pointer-events:none;
    }

    .maintenance::before{
      left:-1px;
      top:-1px;
      border-left:2px solid #4af;
      border-top:2px solid #4af;
    }

    .maintenance::after{
      right:-1px;
      bottom:-1px;
      border-right:2px solid #4af;
      border-bottom:2px solid #4af;
    }

    .status-label{
      margin-bottom:13px;
      color:#8bd;
      font-size:11px;
      font-weight:650;
      letter-spacing:3px;
    }

    .maintenance h2{
      color:#d8ecfb;
      font-size:22px;
      font-weight:650;
      letter-spacing:.04em;
      line-height:1.35;
    }

    .maintenance p{
      margin-top:12px;
      color:#667b8d;
      font-size:12px;
      line-height:1.8;
      letter-spacing:.5px;
    }

    .line{
      width:64px;
      height:1px;
      margin:22px auto 0;
      background:#29435c;
      box-shadow:0 0 10px rgba(68,170,255,.18);
    }

    .footer{
      position:fixed;
      right:20px;
      bottom:16px;
      color:#446;
      font-size:11px;
      letter-spacing:2px;
      text-shadow:0 0 8px #4af,0 0 18px rgba(68,170,255,.27);
    }

    @media (max-width:560px){
      .screen{padding:24px 18px}
      .sub{margin-bottom:28px}
      .maintenance{padding:26px 20px 24px}
      .maintenance h2{font-size:19px}
      .maintenance p{font-size:11px}
      .footer{right:14px;bottom:12px;font-size:9px}
    }
  </style>
</head>
<body>
  <main class="screen">
    <h1 class="title">⚔ DUELS</h1>
    <p class="sub">Made By Lyan___</p>

    <section class="maintenance" aria-label="서버 점검 안내">
      <div class="status-label">SERVER MAINTENANCE</div>
      <h2>서버 점검 중입니다.</h2>
      <p>
        안정적인 서비스 제공을 위해 서버를 점검하고 있습니다.<br>
        점검이 완료된 후 다시 접속해 주세요.
      </p>
      <div class="line"></div>
    </section>
  </main>

  <div class="footer">DUELS</div>
</body>
</html>
